# ============================================
# KITTY CURSOR ANİMASYON AYARLARI
# ============================================

# --- Cursor Temel Ayarları ---
cursor_shape block
cursor #3F2254
cursor_text_color #000000

# --- Cursor Blink Animasyonu (Yanıp Sönme) ---
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 0

# --- Cursor Trail (İz Bırakan Animasyon) ---
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color none

# --- Terminal Temel Ayarları ---
font_size 12.0
background #1a1a1a
foreground #f0f0f0
